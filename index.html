
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHALYAHUB | Movie Streaming</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:white;font-family:Arial,sans-serif}
header{background:#111;padding:18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #292929;position:sticky;top:0;z-index:5}
.logo{font-size:25px;font-weight:bold;letter-spacing:2px;color:#fff}
.logo span{color:#e0b52d}
nav a{color:#ddd;text-decoration:none;margin-left:12px;font-size:13px}
.hero{padding:55px 20px;background:linear-gradient(90deg,#080808,#202020);min-height:260px}
.hero small{color:#e0b52d;letter-spacing:3px}
.hero h1{font-size:38px;margin:15px 0}
.hero p{color:#ccc;max-width:500px;line-height:1.5}
button{background:#e0b52d;border:0;padding:12px 20px;border-radius:5px;font-weight:bold;cursor:pointer}
.search{padding:20px}
input{width:100%;padding:14px;background:#191919;color:white;border:1px solid #444;border-radius:7px;font-size:15px}
.categories{display:flex;gap:9px;overflow-x:auto;padding:5px 20px 18px}
.categories button{white-space:nowrap}
.categories button.active{background:#fff}
section{padding:15px 20px}
h2{font-size:21px}
h2 span{color:#e0b52d}
.movies{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.movie{background:#171717;border-radius:8px;overflow:hidden}
.poster{width:100%;height:170px;object-fit:cover;background:#222}
.movie h3{font-size:15px;margin:10px}
.movie p{font-size:12px;color:#aaa;margin:10px}
.movie button{margin:0 10px 12px;padding:9px 14px}
#playerArea{display:none;background:#151515;padding:20px;margin:20px;border:1px solid #444;border-radius:9px}
video{width:100%;max-height:400px;background:black}
#playerArea iframe{width:100%;height:240px;border:0;background:#000}
footer{text-align:center;color:#888;padding:30px;background:#111;margin-top:30px}
@media(min-width:650px){.movies{grid-template-columns:repeat(4,1fr)}.poster{height:230px}}
</style>
</head>
<body>

<header>
<div class="logo">CHALYA<span>HUB</span></div>
<nav>
<a href="#home">Home</a>
<a href="#movies">Movies</a>
</nav>
</header>

<div class="hero" id="home">
<small>WELCOME TO YOUR CINEMA</small>
<h1>Unlimited Entertainment.</h1>
<p>Discover movies, explore new stories and enjoy your cinema experience.</p>
<button onclick="document.getElementById('movies').scrollIntoView()">Explore Movies</button>
</div>

<div class="search">
<input id="search" placeholder="Search for a movie..." oninput="filterMovies()">
</div>

<div class="categories">
<button class="active" onclick="category('All',this)">All</button>
<button onclick="category('Action',this)">Action</button>
<button onclick="category('Comedy',this)">Comedy</button>
<button onclick="category('Horror',this)">Horror</button>
<button onclick="category('Romance',this)">Romance</button>
<button onclick="category('Drama',this)">Drama</button>
</div>

<section id="movies">
<h2>Explore <span>Movies</span></h2>
<div class="movies" id="movieList"></div>
</section>

<div id="playerArea">
<h2 id="playingTitle">Now Playing</h2>
<div id="player"></div>
<button onclick="closePlayer()">Close Player</button>
</div>

<footer>
<h3>CHALYAHUB</h3>
<p>Your Cinema. Your Entertainment.</p>
<p>Only authorised movie streams are supported.</p>
<p>© 2026 Chalyahub</p>
</footer>

<script>
const movies = [
{title:"Big Buck Bunny",genre:"Comedy",poster:"https://peach.blender.org/wp-content/uploads/title_anouncement.jpg?x11217",type:"video",url:"https://storage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"},
{title:"Sintel",genre:"Drama",poster:"https://durian.blender.org/wp-content/uploads/2010/05/sintel_poster.jpg",type:"video",url:"https://media.w3.org/2010/05/sintel/trailer.mp4"},
{title:"Tears of Steel",genre:"Action",poster:"https://mango.blender.org/wp-content/uploads/2013/05/01_thom_celia_bridge.jpg",type:"video",url:"https://storage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4"},
{title:"Elephants Dream",genre:"Drama",poster:"https://orange.blender.org/wp-content/themes/orange/images/media/gallery/s1_proog.jpg",type:"video",url:"https://storage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4"}
];

let selected="All";

function displayMovies(){
const list=document.getElementById("movieList");
const term=document.getElementById("search").value.toLowerCase();
list.innerHTML="";
movies.filter(m=>(selected==="All"||m.genre===selected)&&m.title.toLowerCase().includes(term)).forEach(m=>{
const card=document.createElement("div");
card.className="movie";
const poster=document.createElement("img");
poster.className="poster";
poster.src=m.poster;
poster.alt=m.title;
const title=document.createElement("h3");
title.textContent=m.title;
const genre=document.createElement("p");
genre.textContent=m.genre;
const btn=document.createElement("button");
btn.textContent="▶ Watch";
btn.onclick=()=>playMovie(m);
card.append(poster,title,genre,btn);
list.appendChild(card);
});
}
function filterMovies(){displayMovies()}
function category(name,btn){
selected=name;
document.querySelectorAll(".categories button").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
displayMovies();
}
function playMovie(m){
document.getElementById("playerArea").style.display="block";
document.getElementById("playingTitle").textContent="Now Playing: "+m.title;
const player=document.getElementById("player");
player.innerHTML="";
const video=document.createElement("video");
video.controls=true;
video.autoplay=true;
video.playsInline=true;
const source=document.createElement("source");
source.src=m.url;
source.type="video/mp4";
video.appendChild(source);
player.appendChild(video);
document.getElementById("playerArea").scrollIntoView({behavior:"smooth"});
}
function closePlayer(){
document.getElementById("playerArea").style.display="none";
document.getElementById("player").innerHTML="";
}
displayMovies();
</script>
</body>
</html>
